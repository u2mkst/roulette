<body>
<script type="module" src="./src/index.ts"></script>
<script type="text/javascript">
function getNames() {
    const value = document.querySelector('#in_names').value.trim();
    return value.split(/[,\r\n]/g).map(v => v.trim()).filter(v => !!v);
  }

  function parseName(nameStr) {
    const weightRegex = /(\/\d+)/;
    const countRegex = /(\*\d+)/;
    const hasWeight = weightRegex.test(nameStr);
    const hasCount = countRegex.test(nameStr);
    const name = /^\s*([^\/*]+)?/.exec(nameStr)[1];
    const weight = hasWeight ? parseInt(weightRegex.exec(nameStr)[1].replace('/', '')) : 1;
    const count = hasCount ? parseInt(countRegex.exec(nameStr)[1].replace('*', '')) : 1;
    return {
      name,
      weight,
      count,
    };
  }

  function getReady() {
    const names = getNames();
    window.roulette.setMarbles(names);
    ready = names.length > 0;
    localStorage.setItem('kst_names', names.join(','));
    applyWinnerSetting();
  }

  // 구슬 수가 바뀔 때마다 다시 호출된다. 범위 클리핑은 roulette이 하고, 잘린 결과를 input에 되돌려 쓴다.
  // edited는 사용자가 방금 고친 범위 input('start' | 'end')
  function applyWinnerSetting(edited) {
    const rankInput = document.querySelector('#in_winningRank');
    const startInput = document.querySelector('#in_rangeStart');
    const endInput = document.querySelector('#in_rangeEnd');

    let start;
    let end;
    switch (winnerType) {
      case 'first':
        start = end = 1;
        break;
      case 'last':
        start = end = window.roulette.getCount();
        break;
      case 'multi':
        start = parseInt(startInput.value, 10) || 1;
        end = parseInt(endInput.value, 10) || 1;
        // 뒤집힌 범위는 방금 고친 쪽을 존중하고 반대쪽을 따라오게 한다
        if (end < start) {
          if (edited === 'end') {
            start = end;
          } else {
            end = start;
          }
        }
        break;
      default:
        start = end = parseInt(rankInput.value, 10) || 1;
    }

    window.roulette.setWinnerRange(start - 1, end - 1);
    const clipped = window.roulette.getWinnerRange();
    // 범위 input은 여러명 모드일 때만 건드린다. 다른 모드가 덮어쓰면 사용자가 넣어둔 범위가 날아간다
    if (winnerType === 'multi') {
      startInput.value = clipped.start + 1;
      endInput.value = clipped.end + 1;
    } else {
      rankInput.value = clipped.start + 1;
    }

    document.querySelector('.btn-first-winner').classList.toggle('active', winnerType === 'first');
    document.querySelector('.btn-last-winner').classList.toggle('active', winnerType === 'last');
    document.querySelector('.btn-multi-winner').classList.toggle('active', winnerType === 'multi');
    rankInput.classList.toggle('active', winnerType === 'custom');
    document.querySelector('.row-range').classList.toggle('active', winnerType === 'multi');
  }

  // 남은 구슬이 모두 골인할 때까지(최대 20초) 기다렸다가 최종 순위표를 띄운다
  let finalTimer = null;
  function waitAndShowFinalRanking() {
    clearTimeout(finalTimer);
    const startedAt = Date.now();
    const tick = () => {
      const done = window.roulette.getRemainingCount() === 0 || Date.now() - startedAt > 20000;
      if (done) {
        finalTimer = setTimeout(() => showFinalRanking(window.roulette.getRanking()), 1200);
      } else {
        finalTimer = setTimeout(tick, 400);
      }
    };
    finalTimer = setTimeout(tick, 2000);
  }

  let lastRanking = [];

  // 우승자 이름 위에서 터지는 폭죽. 외부 라이브러리 없이 캔버스로 그린다
  function fireConfetti() {
    const cv = document.querySelector('#finalConfetti');
    const target = document.querySelector('#finalWinner').getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const colors = ['#ffd84d', '#ff5c8a', '#4cc9f0', '#7bf1a8', '#b388ff', '#ff9f43'];
    const parts = [];
    const burst = (cx, cy, n) => {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
        parts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, g: 0.22 + Math.random() * 0.1,
          w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
          c: colors[(Math.random() * colors.length) | 0], life: 90 + Math.random() * 60 });
      }
    };
    const cx = target.left + target.width / 2, cy = target.top + target.height / 2;
    burst(cx, cy, 90);
    [350, 750, 1200].forEach((t, i) => setTimeout(() => {
      burst(cx + (i - 1) * Math.min(120, target.width / 2), cy - 10, 70);
    }, t));
    let frames = 0;
    const step = () => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach((p) => {
        p.vy += p.g; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
        if (p.life <= 0) return;
        ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 30);
        ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      });
      frames++;
      if (frames < 320 && !document.querySelector('#finalRanking').hidden) requestAnimationFrame(step);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    };
    requestAnimationFrame(step);
  }

  // 카카오 JavaScript 키는 공개용 키다(허용 도메인은 카카오 개발자 콘솔에서 제한한다)
  const KAKAO_JS_KEY = 'cb544b3826c4551884efaf636f5a7fff';
  let kakaoLoading = null;
  function loadKakao() {
    if (window.Kakao && window.Kakao.isInitialized()) return Promise.resolve(window.Kakao);
    if (!kakaoLoading) {
      kakaoLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js';
        s.crossOrigin = 'anonymous';
        s.onload = () => {
          try {
            if (!window.Kakao.isInitialized()) window.Kakao.init(KAKAO_JS_KEY);
            resolve(window.Kakao);
          } catch (e) { reject(e); }
        };
        s.onerror = () => { kakaoLoading = null; reject(new Error('kakao sdk load failed')); };
        document.head.appendChild(s);
      });
    }
    return kakaoLoading;
  }

  // 전체 순위를 짧은 링크로 저장한다. 카톡 메시지는 글자 수 제한이 있어 결과 전체를 링크로 보여준다
  async function saveRanking() {
    const id = Array.from(crypto.getRandomValues(new Uint8Array(10)), (b) => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
    const ranking = lastRanking.slice(0, 300).map((r) => ({ name: String(r.name).slice(0, 40), hue: Math.round(r.hue), rank: r.rank, winning: !!r.winning }));
    const res = await fetch('https://axtibtdqnwjezyqiqeff.supabase.co/rest/v1/results', {
      method: 'POST',
      headers: { apikey: 'sb_publishable_AMAgYO0ye6ykCsJVdzV1jQ_WJXvN9vq', 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ id, ranking }),
    });
    if (!res.ok) throw new Error('save failed ' + res.status);
    return location.origin + '/result.html?id=' + id;
  }

  async function shareResult() {
    const label = document.querySelector('#shareLabel');
    const idle = '카카오톡으로 결과 공유';
    const done = (msg) => { label.textContent = msg; setTimeout(() => { label.textContent = idle; }, 2500); };
    label.textContent = '링크 만드는 중…';

    let url = location.origin + '/';
    let linked = false;
    try { url = await saveRanking(); linked = true; } catch (e) { console.warn('[share] 결과 링크 저장 실패', e); }
    label.textContent = idle;

    const lines = ['🏆 KST Roulette 결과'];
    lastRanking.slice(0, 5).forEach((r) => lines.push(`${r.rank}위  ${r.name}${r.winning ? ' ☆' : ''}`));
    if (lastRanking.length > 5) lines.push(linked ? `… 전체 ${lastRanking.length}명 순위 보기 👇` : `… 외 ${lastRanking.length - 5}명`);
    // 링크는 항상 본문에 직접 넣는다. 공유 시트(카카오톡 등)는 별도로 넘긴 url을 버리는 경우가 있다
    if (linked) lines.push(url);
    const shortText = lines.join('\n');
    // 링크를 만들지 못했을 때를 위해 복사용 텍스트에는 전체 순위를 담는다
    const fullText = ['🏆 KST Roulette 결과', ...lastRanking.slice(0, 40).map((r) => `${r.rank}위  ${r.name}${r.winning ? ' ☆' : ''}`), url].join('\n');

    // 1순위: 카카오톡 공식 공유(친구/채팅방 선택 창). 카카오 텍스트 템플릿은 200자까지라 상위 5명 + 전체 순위 링크를 보낸다
    try {
      const Kakao = await loadKakao();
      Kakao.Share.sendDefault({
        objectType: 'text',
        text: shortText,
        link: { mobileWebUrl: url, webUrl: url },
        buttonTitle: linked ? '전체 순위 보기' : '나도 돌려보기',
      });
      return;
    } catch (e) {
      console.warn('[share] 카카오 공유를 쓸 수 없어 기본 공유로 전환합니다', e);
    }
    // 2순위: 모바일 공유 시트(카카오톡 포함). 3순위: 복사해서 붙여넣기
    const text = linked ? shortText : fullText;
    if (navigator.share) {
      try { await navigator.share({ title: 'KST Roulette', text }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(text);
      done('복사됨! 카톡에 붙여넣으세요');
    } catch (e) {
      prompt('아래 내용을 복사해서 카카오톡에 붙여넣으세요', text);
    }
  }

  function showFinalRanking(ranking) {
    if (!ranking || !ranking.length) return;
    lastRanking = ranking;
    const box = document.querySelector('#finalRanking');
    const list = document.querySelector('#finalList');
    list.replaceChildren();
    const top = ranking[0];
    document.querySelector('#finalWinner').textContent = top.name;
    document.querySelector('#finalWinner').style.color = `hsl(${top.hue} 100% 72%)`;
    ranking.forEach((r) => {
      const li = document.createElement('li');
      if (r.winning) li.classList.add('winning');
      if (!r.finished) li.classList.add('running');
      const no = document.createElement('span'); no.className = 'no'; no.textContent = r.rank;
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name;
      nm.style.color = `hsl(${r.hue} 100% 72%)`;
      const tag = document.createElement('span'); tag.className = 'tag';
      tag.textContent = r.winning ? '당첨' : (r.finished ? '' : '진행 중');
      li.append(no, nm, tag);
      list.append(li);
    });
    document.querySelector('#finalNote').hidden = ranking.every((r) => r.finished);
    box.hidden = false;
    list.scrollTop = 0;
    fireConfetti();
  }

  function selectWinnerType(type, edited) {
    winnerType = type;
    applyWinnerSetting(edited);
  }


  let ready = false;
  let winnerType = 'first';

  document.addEventListener('DOMContentLoaded', () => {
    initialize();
  });

  function initialize() {
    if (!window.roulette || !window.roulette.isReady) {
      console.log('does not loaded yet');
      setTimeout(initialize, 100);
      return;
    }
    console.log('initializing start');

    const urlParams = new URLSearchParams(window.location.search);
    const namesFromUrl = urlParams.get('names');

    if (namesFromUrl) {
      document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
    } else {
      const savedNames = localStorage.getItem('kst_names');
      if (savedNames) {
        document.querySelector('#in_names').value = savedNames;
      }
    }
    document.querySelector('#in_names').addEventListener('input', () => {
      getReady();
    });

    document.querySelector('#in_names').addEventListener('blur', () => {
      const nameSource = getNames();
      const nameSet = new Set();
      const nameCounts = {};
      nameSource.forEach(nameSrc => {
        const name = parseName(nameSrc);
        const key = name.weight > 1 ? `${name.name}/${name.weight}` : name.name;
        if (!nameSet.has(key)) {
          nameSet.add(key);
          nameCounts[key] = 0;
        }
        nameCounts[key] += name.count;
      });
      const result = [];
      Object.keys(nameCounts).forEach(key => {
        if (nameCounts[key] > 1) {
          result.push(`${key}*${nameCounts[key]}`);
        } else {
          result.push(key);
        }
      });

      const oldValue = document.querySelector('#in_names').value;
      const newValue = result.join(',');

      if (oldValue !== newValue) {
        document.querySelector('#in_names').value = newValue;
        getReady();
      }
    });

    document.querySelector('#btnShuffle').addEventListener('click', () => {
      getReady();
    });

    document.querySelector('#btnStart').addEventListener('click', () => {
      if (!ready) return;
      clearTimeout(finalTimer);
      const names = getNames();
      const marbles = names.map(n => {
        const p = parseName(n);
        return { name: p.name, count: p.count };
      });
      document.querySelector('#settings').classList.add('hide');
      if (window.ads) {
        window.ads.beginRound(() => window.roulette.start());
      } else {
        window.roulette.start();
      }
    });

    document.querySelector('#chkAutoRecording').addEventListener('change', (e) => {
      window.options.autoRecording = e.target.matches(':checked');
      window.roulette.setAutoRecording(window.options.autoRecording);
    });

    document.querySelector('#chkSkill').addEventListener('change', (e) => {
      window.options.useSkills = e.target.matches(':checked');
    });

    document.querySelector('#chkDarkMode').addEventListener('change', (e) => {
      window.options.darkMode = e.target.matches(':checked');
      window.roulette.setTheme(window.options.darkMode ? 'dark' : 'light');
      document.documentElement.classList.toggle('light', !window.options.darkMode);
    });

    document.querySelector('#in_winningRank').addEventListener('change', () => selectWinnerType('custom'));
    document.querySelector('.btn-last-winner').addEventListener('click', () => selectWinnerType('last'));
    document.querySelector('.btn-first-winner').addEventListener('click', () => selectWinnerType('first'));
    document.querySelector('.btn-multi-winner').addEventListener('click', () => selectWinnerType('multi'));
    document.querySelector('#in_rangeStart').addEventListener('change', () => selectWinnerType('multi', 'start'));
    document.querySelector('#in_rangeEnd').addEventListener('change', () => selectWinnerType('multi', 'end'));

    window.roulette.addEventListener('goal', (e) => {
      ready = false;
      waitAndShowFinalRanking();
      if (window.ads) window.ads.showResult();
      setTimeout(() => {
        document.querySelector('#settings').classList.remove('hide');
      }, 3000);
    });

    window.roulette.addEventListener('message', (e) => {
      simpleToast(e.detail);
    });

    const toggleBtn = document.querySelector('#btnToggleSettings');
    const collapsible = document.querySelector('.collapsible-rows');
    toggleBtn.addEventListener('click', () => {
      collapsible.classList.toggle('collapsed');
      toggleBtn.querySelector('.toggle-arrow').textContent =
        collapsible.classList.contains('collapsed') ? '▲' : '▼';
    });

    document.querySelector('#btnShareKakao').addEventListener('click', shareResult);
    document.querySelector('#btnCloseFinal').addEventListener('click', () => {
      document.querySelector('#finalRanking').hidden = true;
    });
    document.querySelector('#btnShuffle').addEventListener('click', () => {
      clearTimeout(finalTimer);
      document.querySelector('#finalRanking').hidden = true;
    });

    document.querySelector('#btnShuffle').click();

    const maps = window.roulette.getMaps();
    const mapSelector = document.querySelector('#sltMap');
    maps.forEach((map) => {
      const option = document.createElement('option');
      option.value = map.index;
      option.innerHTML = map.title;
      option.setAttribute('data-trans', '');
      window.translateElement(option);
      mapSelector.append(option);
    });
    mapSelector.addEventListener('change', (e) => {
      window.roulette.setMap(e.target.value);
      // setMap은 살아남은 구슬에서 이름을 뽑아 재구성한다. 골인한 구슬이 사라지고
      // 무게(/n)도 날아가므로, 원본인 이름 입력창에서 다시 채운다
      getReady();
    });

    // const checkDonateButtonLoaded = () => {
    //   const btn = document.querySelector('span.bmc-btn-text');
    //   if (!btn) {
    //     setTimeout(checkDonateButtonLoaded, 100);
    //   } else {
    //     console.log('donation button has been loaded');
    //     btn.setAttribute('data-trans', '');
    //     window.translateElement(btn);
    //   }
    // };
    // setTimeout(checkDonateButtonLoaded, 100);

  }
</script>
<h1 class="sr-only">KST Roulette</h1>
<div class="brand">KST Roulette</div>
<div class="kst-mark" aria-hidden="true"></div>

<div id="finalRanking" class="final" hidden>
  <canvas id="finalConfetti" class="final-confetti"></canvas>
  <div class="final-card" role="dialog" aria-label="최종 순위">
    <button id="btnCloseFinal" class="final-close" aria-label="닫기">×</button>
    <div class="final-head">
      <div class="final-trophy">🏆</div>
      <div class="final-label">1위</div>
      <div id="finalWinner" class="final-winner"></div>
    </div>
    <h2 class="final-title">최종 순위</h2>
    <ol id="finalList" class="final-list"></ol>
    <p id="finalNote" class="final-note" hidden>순위가 확정된 구슬 뒤의 "진행 중"은 현재 위치 기준입니다.</p>
    <button id="btnShareKakao" class="final-share" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3C6.48 3 2 6.58 2 11c0 2.84 1.87 5.33 4.69 6.75l-.95 3.5c-.08.3.26.54.52.36l4.2-2.78c.5.06 1.01.17 1.54.17 5.52 0 10-3.58 10-8S17.52 3 12 3z"/></svg>
      <span id="shareLabel">카카오톡으로 결과 공유</span>
    </button>
    <div class="final-foot">
      <span class="final-mark" aria-hidden="true"></span>
      <span class="final-brand">KST Roulette</span>
    </div>
  </div>
</div>
<div id="settings" class="settings">
  <div class="right">
    <button id="btnToggleSettings" class="btn-toggle-settings">
      <span data-trans>Settings</span>
      <i class="toggle-arrow">▲</i>
    </button>
    <div class="collapsible-rows collapsed">
      <div class="row">
        <label for='sltMap'>
          <i class="icon map"></i>
          <span data-trans>Map</span>
        </label>
        <select id="sltMap"></select>
      </div>
      <div class="row row-toggles">
        <div class='toggle-item'>
          <label for='chkAutoRecording'>
            <i class="icon record"></i>
            <span data-trans>Recording</span>
          </label>
          <input type="checkbox" id="chkAutoRecording" />
        </div>
        <div class='toggle-item'>
          <label for='chkSkill'>
            <i class="icon bomb"></i>
            <span data-trans>Using skills</span>
          </label>
          <input type="checkbox" id="chkSkill" checked />
        </div>
      </div>
      <div class="row">
        <label>
          <i class="icon trophy"></i>
          <span data-trans>The winner is</span>
        </label>
        <div class="btn-group">
          <button class="btn-winner btn-first-winner active" data-trans>First</button>
          <button class="btn-winner btn-last-winner" data-trans>Last</button>
          <input type="number" id="in_winningRank" value="1" min="1" />
          <button class="btn-winner btn-multi-winner" data-trans>Multiple</button>
        </div>
      </div>
      <div class="row row-range">
        <label></label>
        <div class="btn-group range-group">
          <input type="number" id="in_rangeStart" value="1" min="1" />
          <span class="range-sep">~</span>
          <input type="number" id="in_rangeEnd" value="3" min="1" />
        </div>
      </div>
      <div class="row row-theme">
        <div class='theme'>
          <i class='icon sun'></i>
          <input type='checkbox' id='chkDarkMode' checked />
          <i class='icon moon'></i>
        </div>
      </div>
    </div>
  </div>
  <div class="left">
    <h3 data-trans>Enter names below</h3>
    <textarea id="in_names" placeholder="Input names separated by commas or line feed here" data-trans="placeholder">한이,바가,라면,진상,가오충,제육,지후,래윤,테무</textarea>
    <div class="actions">
      <div class="sep"></div>
      <button id="btnShuffle">
        <i class="icon shuffle"></i>
        <span data-trans>Shuffle</span>
      </button>
      <button id="btnStart">
        <i class="icon play"></i>
        <span data-trans>Start</span>
      </button>
    </div>
  </div>
</div>

</body>
</html>
